# プッシュやプルリクエストのたびに、GitHub の Mac 上で自動でビルドとテストを行う。
name: CI

on:
  push:
    branches: ["**"]  # どのブランチにプッシュしてもテストする
  pull_request:

jobs:
  test:
    # iOS 27 用のアプリを作るには Xcode 27 が必要。新しい Mac の実行環境を使う。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 27 を選ぶ
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::Xcode 27 がこの実行環境に見つかりません"; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Swift パッケージのテスト
        run: swift test
      - name: XcodeGen を入れる
        run: brew install xcodegen
      - name: Xcode プロジェクトを生成
        run: xcodegen generate
      - name: iOS アプリをビルド(シミュレータ向け・署名なし)
        run: |
          xcodebuild build \
            -project JVTranslator.xcodeproj \
            -scheme JVTranslator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Mac コンパニオンアプリをビルド(署名なし)
        run: |
          xcodebuild build \
            -project JVTranslator.xcodeproj \
            -scheme JVTranslatorCompanion \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
