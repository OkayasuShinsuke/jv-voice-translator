# プッシュやプルリクエストのたびに、GitHub の Mac 上で自動でビルドとテストを行う。
name: CI

on:
  push:
    branches: ["**"]  # どのブランチにプッシュしてもテストする
  pull_request:

jobs:
  test:
    # macos-26 の実行環境には Xcode 26 系が入っている。いちばん新しいものを使う。
    # (2026年9月時点で GitHub には Xcode 27 がまだ無い。入ったら 27 に切り替える)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: いちばん新しい Xcode を選ぶ
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Swift パッケージのテスト
        run: swift test
      - name: XcodeGen を入れる
        run: brew install xcodegen
      - name: Xcode プロジェクトを生成
        run: xcodegen generate
      - name: iOS アプリをビルド(シミュレータ向け・署名なし)
        run: |
          xcodebuild build \
            -project JVTranslator.xcodeproj \
            -scheme JVTranslator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Mac コンパニオンアプリをビルド(署名なし)
        run: |
          xcodebuild build \
            -project JVTranslator.xcodeproj \
            -scheme JVTranslatorCompanion \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
